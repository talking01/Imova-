<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B2545">
  <meta name="robots" content="noindex">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="forms.css">
  <link rel="stylesheet" href="responsive.css">
  <script src="theme.js"></script>
  <title>Connexion — Imova</title>
</head>
<body>
  <div class="app">
    <main class="view auth-view" id="main">
      <a class="auth-brand" href="index.html"><img src="logo.svg" width="40" height="40" alt=""><span>Imova</span></a>
      <h1>Connexion</h1>
      <p class="muted" id="subtitle">Heureux de vous revoir.</p>
      <form class="form card" id="form" novalidate>
        <div class="field">
          <label for="email">Adresse e-mail</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false">
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <div class="input-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password">
            <button class="eye" type="button" id="eye" aria-label="Afficher le mot de passe" data-icon="eye"></button>
          </div>
        </div>
        <div class="form-error" id="formError" role="alert" hidden></div>
        <button class="btn btn-primary btn-block" id="submit" type="submit">Se connecter</button>
      </form>
      <p class="form-links"><a href="reset.html" id="resetLink">Mot de passe oublié ?</a></p>
      <p class="form-links">Pas encore de compte ? <a href="register.html" id="registerLink">Créer un compte</a></p>
    </main>
  </div>
  <div id="overlay-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="login.js"></script>
</body>
</html>
