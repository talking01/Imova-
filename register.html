<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B2545">
  <meta name="robots" content="noindex">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="forms.css">
  <link rel="stylesheet" href="register.css">
  <link rel="stylesheet" href="responsive.css">
  <script src="theme.js"></script>
  <title>Créer un compte — Imova</title>
</head>
<body>
  <div class="app">
    <main class="wiz" id="wiz">
      <div class="wiz-top">
        <button class="back" id="backBtn" type="button" aria-label="Étape précédente" hidden data-icon="back"></button>
        <a class="auth-brand" href="index.html"><img src="logo.svg" width="36" height="36" alt=""><span>Imova</span></a>
      </div>
      <div class="progress" aria-live="polite">
        <div class="progress-bar"><i id="bar"></i></div>
        <div class="progress-label"><span id="stepName">Type de compte</span><span id="stepCount">Étape 1 sur 4</span></div>
      </div>
      <form id="form" novalidate autocomplete="on"></form>
      <p class="form-links" id="loginLine">Vous avez déjà un compte ? <a href="login.html" id="loginLink">Se connecter</a></p>
    </main>
  </div>
  <div id="overlay-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="register.js"></script>
</body>
</html>
