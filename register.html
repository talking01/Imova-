<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B2545">
  <meta name="robots" content="noindex">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="forms.css">
  <link rel="stylesheet" href="responsive.css">
  <script src="theme.js"></script>
  <title>Inscription — Imova</title>
</head>
<body>
  <div class="app">
    <main class="view auth-view" id="main">
      <a class="auth-brand" href="index.html"><img src="logo.svg" width="40" height="40" alt=""><span>Imova</span></a>
      <h1>Créer un compte</h1>
      <p class="muted">Publiez, échangez et suivez les biens qui vous intéressent.</p>
      <form class="form card" id="form" novalidate>
        <fieldset class="field">
          <legend>Type de compte</legend>
          <div class="segmented">
            <label><input type="radio" name="type" value="particulier" checked><span>Particulier</span></label>
            <label><input type="radio" name="type" value="agence"><span>Agence</span></label>
          </div>
          <p class="hint">Ce choix est définitif : il ne pourra pas être modifié ensuite.</p>
        </fieldset>
        <div class="field">
          <label for="name" id="nameLabel">Nom complet</label>
          <input class="input" id="name" name="name" type="text" autocomplete="name" maxlength="60">
        </div>
        <div class="field">
          <label for="email">Adresse e-mail</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false">
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <div class="input-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="new-password">
            <button class="eye" type="button" id="eye" aria-label="Afficher le mot de passe" data-icon="eye"></button>
          </div>
          <p class="hint">8 caractères minimum.</p>
        </div>
        <div class="field">
          <label for="confirm">Confirmer le mot de passe</label>
          <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password">
        </div>
        <div class="form-error" id="formError" role="alert" hidden></div>
        <button class="btn btn-primary btn-block" id="submit" type="submit">Créer mon compte</button>
      </form>
      <p class="form-links">Vous avez déjà un compte ? <a href="login.html" id="loginLink">Se connecter</a></p>
    </main>
  </div>
  <div id="overlay-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="register.js"></script>
</body>
</html>
